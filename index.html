<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - פאלאס</title><style>:root{--g:#c9a84c;--g2:#e8c97a;--b:#0f0f1a;--c:#16213e;--bd:#2a3f60;--t:#f0ead6}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--b);color:var(--t);margin:0;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}header{position:sticky;top:0;z-index:10;background:var(--c);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;text-align:center;border-bottom:2px solid var(--g)}header small{color:var(--g);letter-spacing:3px}h1{margin:3px 0 0;font-size:24px}.w{padding:10px}.row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-bottom:7px;direction:rtl}.name{flex:1;text-align:right;direction:rtl;font-size:14px}.q{display:flex;direction:rtl;flex:0 0 auto;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.q button,.q input{width:36px;height:34px;border:0;background:var(--b);color:var(--t);text-align:center;font-size:16px}.q button{color:var(--g);font-size:20px}.gap{height:16px}textarea{width:100%;min-height:70px;background:var(--c);color:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;font-family:inherit}.warn{text-align:center;color:var(--g2);font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:var(--b);border-top:2px solid var(--g);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{padding:0 18px;height:42px;border:0;background:#25D366;color:#fff;border-radius:10px;font-weight:700;font-size:15px}#count{color:var(--g);font-size:20px}</style></head><body><header><small>✦ הזמנה ✦</small><h1>פאלאס</h1></header><div class="w" id="list"></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const PHONE='972544274897',RET='‼️*לידע נהג לקח החזרות*‼️',RLM='\u200F',LRM='\u200E';const G=[['משטח גביע 500','משטח גביע 1000','מכסה לגביע 500'],['כוס 200'],['אפיה 40/60','נייר אפיה ביתי 50 י״ח'],['מזלג שקוף','כפות שקוף','סכין שקוף','כפית שקוף'],['מזלג קרם','כפות קרם','סכין קרם','כפית קרם'],['מזלג שחור','כפות שחור','סכין שחור','כפית שחור'],['צלחת קטנה ארוז 50','צלחת בינונית ארוז 50'],['צלחת 9 ארוז 100 י״ח','צלחת 9 ארוז 1 ק״ג'],['אלגנט 7 לבן','אלגנט 9 לבן','אלגנט 10 לבן','מרק אלגנט לבן','לפתניה אלגנט לבן'],['אלגנט 7 קרם','אלגנט 9 קרם','אלגנט 10 קרם','מרק אלגנט קרם','לפתניה אלגנט קרם'],['אלגנט 7 שחור','אלגנט 9 שחור','אלגנט 10 שחור','מרק אלגנט שחור','ליפתניה אלגנט שחור'],['ליפתניה שקוף','קסרול שקוף'],['מגש אובלי אלגנט לבן','מגש אובלי אלגנט קרם','אובלי עמוק אלגנט לבן','אובלי עמוק אלגנט קרם'],['קערה סלט לבן','קערה סלט קרם','קערה סלט שקוף'],['נשמה 24 פחית','נשמה 48 זכוכיות','נשמה שבועי זכוכית','להבונים'],['מפה ראנר זהב','מפה ראנר כסף'],[RET]];const L=document.getElementById('list');G.forEach((g,gi)=>{if(gi)L.insertAdjacentHTML('beforeend','<div class="gap"></div>');g.forEach(p=>{const r=document.createElement('div');r.className='row';r.dataset.group=gi;r.innerHTML='<span class="name"></span><div class="q"><button onclick="chg(this,-1)">−</button><input type="number" min="0" value="0" inputmode="numeric"><button onclick="chg(this,1)">+</button></div>';r.querySelector('.name').textContent=p;r.querySelector('input').oninput=refresh;L.appendChild(r)})});L.insertAdjacentHTML('beforeend','<textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div>');function chg(b,d){const i=b.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);count.textContent=t}function orderLine(name,q){return RLM+'• '+name+RLM+': '+LRM+q+RLM}function sendOrder(){const lines=['🛒 *הזמנה - פאלאס*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;G.forEach((g,gi)=>{const sel=[];document.querySelectorAll('.row[data-group="'+gi+'"]').forEach(r=>{const q=parseInt(r.querySelector('input').value)||0;if(q>0){sel.push(orderLine(r.querySelector('.name').textContent,q));total+=q}});if(sel.length)lines.push('',...sel)});if(!total){alert('לא נבחרו פריטים');return}const n=notes.value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשר*');const msg=lines.map(x=>RLM+x+RLM).join('\n');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)}</script></body></html>
